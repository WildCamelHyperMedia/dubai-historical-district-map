<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Dubai Historical District — Interactive Map</title>
  <meta name="description" content="Interactive map of the Dubai Historical District for web and kiosk — Wild Camel HyperMedia prototype for Dubai Culture.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F3E8D6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Historical District">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="map.css">
  <style>
    html, body { margin: 0; height: 100%; background: #F3E8D6; }
    #dhd-map-widget { height: 100vh; height: 100dvh; }
  </style>
</head>
<body>
  <div id="dhd-map-widget" data-lang="en" dir="ltr"></div>
  <script src="data/pois.js"></script>
  <script src="map.js"></script>
  <script>
    (function () {
      var q = {};
      window.location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
        if (!kv) return; var p = kv.split('='); q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
      });
      window.DHDMap.init({
        container: '#dhd-map-widget',
        mode: q.mode === 'kiosk' ? 'kiosk' : 'web',
        orientation: q.orientation || 'auto',
        lang: q.lang || 'en',
        showLangToggle: true,
        showLanding: q.landing !== '0',
        idleSeconds: q.idle ? parseInt(q.idle, 10) : 75,
        dataUrl: 'data/pois.json',
        artwork: q.art === 'print' ? 'print' : 'clean',
        assetsBase: ''
      });
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
